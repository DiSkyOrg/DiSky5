plugins {
    id 'java-library'
}

group   = 'net.itsthesky'
version = '5.0.0'

repositories {
    mavenCentral()
    maven { url 'https://m2.dv8tion.net/releases' }
}

dependencies {
    compileOnly 'net.dv8tion:JDA:6.7.0'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}
