name: build

on:
  push:
    branches: [main, '[0-9]*.[0-9]*.x']
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: gradle/actions/wrapper-validation@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v6

      # Compiles all three modules, runs the annotation processor, runs the tests
      # (golden syntax manifest included) and produces the shaded jar.
      - name: Build
        run: ./gradlew build --no-daemon

      - name: Upload plugin jar
        uses: actions/upload-artifact@v7
        with:
          name: DiSky-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ github.sha }}
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

      # The golden test writes the current syntax surface here when it fails; keeping it
      # makes "what did this PR change in the user-facing syntax" a one-download question.
      - name: Upload syntax digest on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: syntax-digest-${{ github.sha }}
          path: build/reports/golden/**
          if-no-files-found: ignore
